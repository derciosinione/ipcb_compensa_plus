- name: Install Docker Engine from Ubuntu repositories
  ansible.builtin.apt:
    name:
      - docker.io
    update_cache: true
    cache_valid_time: 3600
    state: present

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Allow SSH user to run Docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
