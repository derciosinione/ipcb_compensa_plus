services:
  postgres:
    build:
      context: ./Database
      dockerfile: Dockerfile
    container_name: compensa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compensa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compensa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-compensa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - compensa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compensa} -d ${POSTGRES_DB:-compensa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compensa

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: compensa-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compensa

  redis:
    image: redis:7-alpine
    container_name: compensa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compensa

  identity-api:
    build:
      context: .
      dockerfile: Backend/Compensa.Identity.Api/CompensaIdentityApi/Dockerfile
    container_name: compensa-identity-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${IDENTITY_DB:-CompensaIdentityDB};Username=${POSTGRES_USER:-compensa};Password=${POSTGRES_PASSWORD:-compensa_dev_password}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-info@kiaricode.com}
      Email__FromName: ${EMAIL_FROM_NAME:-Compensa+}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-smtp.privateemail.com}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__Username: ${EMAIL_USERNAME:-info@kiaricode.com}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__UseStartTls: ${EMAIL_USE_STARTTLS:-true}
      MagicLinks__ExpirationMinutes: ${MAGIC_LINK_EXPIRATION_MINUTES:-15}
      MagicLinks__VerifyPath: /auth/verify
      MagicLinks__ClientBaseUrl: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
      Cors__AllowedOrigins__0: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
      Jwt__Issuer: ${JWT_ISSUER:-Compensa.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-Compensa.Api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-CHANGE_ME_DEVELOPMENT_SIGNING_KEY_32_CHARS_MINIMUM}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      RabbitMq__Url: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      IdentitySeed__AdminEmail: ${IDENTITY_SEED_ADMIN_EMAIL:-}
      IdentitySeed__AdminFullName: ${IDENTITY_SEED_ADMIN_FULL_NAME:-Compensa Admin}
      Redis__ConnectionString: compensa-redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "${IDENTITY_API_PORT:-5002}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - compensa

  core-api:
    build:
      context: .
      dockerfile: Backend/Compensa.Core.Api/CompensaCoreApi/Dockerfile
    container_name: compensa-core-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${CORE_DB:-CompensaCoreDB};Username=${POSTGRES_USER:-compensa};Password=${POSTGRES_PASSWORD:-compensa_dev_password}
      Services__IdentityApi: http://identity-api:8080
      Services__CompensaAI: http://compensa-ai:8000
      Jwt__Issuer: ${JWT_ISSUER:-Compensa.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-Compensa.Api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-CHANGE_ME_DEVELOPMENT_SIGNING_KEY_32_CHARS_MINIMUM}
      RabbitMq__Url: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      Cors__AllowedOrigins__0: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
      Redis__ConnectionString: compensa-redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "${CORE_API_PORT:-5001}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      identity-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - compensa

  compensa-ai:
    build:
      context: .
      dockerfile: Backend/CompensaAI/Dockerfile
    container_name: compensa-ai
    restart: unless-stopped
    environment:
      COMPENSA_AI_ENVIRONMENT: ${COMPENSA_AI_ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-compensa}:${POSTGRES_PASSWORD:-compensa_dev_password}@postgres:5432/${AI_DB:-CompensaAiDB}
      CORE_API_URL: http://core-api:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-CHANGE_ME_DEVELOPMENT_SIGNING_KEY_32_CHARS_MINIMUM}
      JWT_ISSUER: ${JWT_ISSUER:-Compensa.Identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-Compensa.Api}
      REDIS_URL: redis://compensa-redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "${COMPENSA_AI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - compensa

  notifications-api:
    build:
      context: ./Backend/Compensa.Notifications
      dockerfile: Dockerfile
    container_name: compensa-notifications
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-compensa}:${POSTGRES_PASSWORD:-compensa_dev_password}@postgres:5432/${NOTIFICATIONS_DB:-CompensaNotificationsDB}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-CHANGE_ME_DEVELOPMENT_SIGNING_KEY_32_CHARS_MINIMUM}
      JWT_ISSUER: ${JWT_ISSUER:-Compensa.Identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-Compensa.Api}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.privateemail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-info@kiaricode.com}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-info@kiaricode.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Compensa+}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "${NOTIFICATIONS_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - compensa

  api-gateway:
    build:
      context: .
      dockerfile: Backend/Compensa.Gateway/CompensaGateway/Dockerfile
    container_name: compensa-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "${GATEWAY_PORT:-5005}:8080"
    depends_on:
      identity-api:
        condition: service_healthy
      core-api:
        condition: service_healthy
      notifications-api:
        condition: service_healthy
      compensa-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - compensa

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5005}
    container_name: compensa-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      core-api:
        condition: service_healthy
      identity-api:
        condition: service_healthy
      compensa-ai:
        condition: service_healthy
      notifications-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - compensa

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics
    networks:
      - compensa

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: aspire-dashboard
    restart: unless-stopped
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
      - ASPNETCORE_URLS=http://+:18888
    ports:
      - "18888:18888" # Dashboard UI
      - "18889:18889" # OTLP gRPC
      - "18890:18890" # OTLP HTTP
    networks:
      - compensa

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - compensa

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      - compensa

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${EMAIL_SMTP_HOST:-smtp.privateemail.com}:587
      - GF_SMTP_USER=${EMAIL_USERNAME:-info@kiaricode.com}
      - GF_SMTP_PASSWORD=${EMAIL_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-info@kiaricode.com}
      - GF_SMTP_FROM_NAME=${EMAIL_FROM_NAME:-Compensa Alerting}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - compensa

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - compensa

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # tempo
      - "4317" # otlp grpc
    networks:
      - compensa

volumes:
  compensa_postgres_data:

networks:
  compensa:
    driver: bridge
