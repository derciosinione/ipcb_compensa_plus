server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not cache index.html to ensure clients always get the latest build assets
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets heavily since their filenames contain content hashes
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
