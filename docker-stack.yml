services:
  postgres:
    image: ${IMAGE_REGISTRY_PREFIX:-}compensa-postgres:${IMAGE_TAG:-local}
    build:
      context: ./Database
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compensa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-compensa}
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:-5432}
        protocol: tcp
        mode: ingress
    volumes:
      - compensa_postgres_data:/var/lib/postgresql/data
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.db == true
      restart_policy:
        condition: on-failure

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - target: 5672
        published: ${RABBITMQ_PORT:-5672}
        protocol: tcp
        mode: ingress
      - target: 15672
        published: ${RABBITMQ_MGMT_PORT:-15672}
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.cache == true
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.cache == true
      restart_policy:
        condition: on-failure

  identity-api:
    image: ${IMAGE_REGISTRY_PREFIX:-}compensa-identity-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Backend/Compensa.Identity.Api/CompensaIdentityApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${IDENTITY_DB:-CompensaIdentityDB};Username=${POSTGRES_USER:-compensa};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-info@kiaricode.com}
      Email__FromName: ${EMAIL_FROM_NAME:-Compensa+}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-smtp.privateemail.com}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__Username: ${EMAIL_USERNAME:-info@kiaricode.com}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__UseStartTls: ${EMAIL_USE_STARTTLS:-true}
      MagicLinks__ExpirationMinutes: ${MAGIC_LINK_EXPIRATION_MINUTES:-15}
      MagicLinks__VerifyPath: /auth/verify
      MagicLinks__ClientBaseUrl: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
      Cors__AllowedOrigins__0: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
      Jwt__Issuer: ${JWT_ISSUER:-Compensa.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-Compensa.Api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-1440}
      RabbitMq__Url: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      IdentitySeed__AdminEmail: ${IDENTITY_SEED_ADMIN_EMAIL:-}
      IdentitySeed__AdminFullName: ${IDENTITY_SEED_ADMIN_FULL_NAME:-Compensa Admin}
      Redis__ConnectionString: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - target: 8080
        published: ${IDENTITY_API_PORT:-5002}
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.backend == true
      restart_policy:
        condition: on-failure

  core-api:
    image: ${IMAGE_REGISTRY_PREFIX:-}compensa-core-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Backend/Compensa.Core.Api/CompensaCoreApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${CORE_DB:-CompensaCoreDB};Username=${POSTGRES_USER:-compensa};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Services__IdentityApi: http://identity-api:8080
      Services__CompensaAI: http://compensa-ai:8000
      Jwt__Issuer: ${JWT_ISSUER:-Compensa.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-Compensa.Api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      RabbitMq__Url: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      Cors__AllowedOrigins__0: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
      Redis__ConnectionString: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - target: 8080
        published: ${CORE_API_PORT:-5001}
        protocol: tcp
        mode: ingress
    volumes:
      - compensa_core_uploads:/app/uploads
    networks:
      - compensa
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.compensa.backend == true
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure

  compensa-ai:
    image: ${IMAGE_REGISTRY_PREFIX:-}compensa-ai:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Backend/CompensaAI/Dockerfile
    environment:
      COMPENSA_AI_ENVIRONMENT: ${COMPENSA_AI_ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-compensa}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${AI_DB:-CompensaAiDB}
      CORE_API_URL: http://core-api:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      JWT_ISSUER: ${JWT_ISSUER:-Compensa.Identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-Compensa.Api}
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - target: 8000
        published: ${COMPENSA_AI_PORT:-8000}
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.backend == true
      restart_policy:
        condition: on-failure

  notifications-api:
    image: ${IMAGE_REGISTRY_PREFIX:-}compensa-notifications:${IMAGE_TAG:-local}
    build:
      context: ./Backend/Compensa.Notifications
      dockerfile: Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-compensa}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${NOTIFICATIONS_DB:-CompensaNotificationsDB}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      JWT_ISSUER: ${JWT_ISSUER:-Compensa.Identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-Compensa.Api}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.privateemail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-info@kiaricode.com}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-info@kiaricode.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Compensa+}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - target: 8000
        published: ${NOTIFICATIONS_PORT:-8001}
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.compensa.backend == true
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure

  api-gateway:
    image: ${IMAGE_REGISTRY_PREFIX:-}compensa-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Backend/Compensa.Gateway/CompensaGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - target: 8080
        published: ${GATEWAY_PORT:-5005}
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.manager == true
      restart_policy:
        condition: on-failure

  frontend:
    image: ${IMAGE_REGISTRY_PREFIX:-}compensa-frontend:${IMAGE_TAG:-local}
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_ENABLE_DEV_LOGIN: ${VITE_ENABLE_DEV_LOGIN:-false}
    ports:
      - target: 80
        published: ${FRONTEND_PORT:-5173}
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.manager == true
      restart_policy:
        condition: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otel-collector-config.yaml
    ports:
      - target: 4317
        published: 4317
        protocol: tcp
        mode: ingress
      - target: 4318
        published: 4318
        protocol: tcp
        mode: ingress
      - target: 8889
        published: 8889
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.ops == true

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      ASPNETCORE_URLS: http://+:18888
    ports:
      - target: 18888
        published: 18888
        protocol: tcp
        mode: ingress
      - target: 18889
        published: 18889
        protocol: tcp
        mode: ingress
      - target: 18890
        published: 18890
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.ops == true
      restart_policy:
        condition: on-failure

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.ops == true
      restart_policy:
        condition: on-failure

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - target: 9093
        published: 9093
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.ops == true
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.privateemail.com}:587
      GF_SMTP_USER: ${EMAIL_USERNAME:-info@kiaricode.com}
      GF_SMTP_PASSWORD: ${EMAIL_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-info@kiaricode.com}
      GF_SMTP_FROM_NAME: ${EMAIL_FROM_NAME:-Compensa Alerting}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.ops == true
      restart_policy:
        condition: on-failure

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/local-config.yaml
    ports:
      - target: 3100
        published: 3100
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.ops == true
      restart_policy:
        condition: on-failure

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - target: 3200
        published: 3200
        protocol: tcp
        mode: ingress
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.ops == true
      restart_policy:
        condition: on-failure

  portainer-agent:
    image: portainer/agent:2.21.5
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - compensa
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  portainer:
    image: portainer/portainer-ce:2.21.5
    command: -H tcp://tasks.portainer-agent:9001 --tlsskipverify
    ports:
      - target: 9000
        published: ${PORTAINER_PORT:-9000}
        protocol: tcp
        mode: ingress
      - target: 9443
        published: ${PORTAINER_HTTPS_PORT:-9443}
        protocol: tcp
        mode: ingress
    volumes:
      - portainer_data:/data
    networks:
      - compensa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.compensa.ops == true
      restart_policy:
        condition: on-failure

volumes:
  compensa_postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-compensaproject_compensa_postgres_data}
  compensa_core_uploads:
    name: ${CORE_UPLOADS_VOLUME_NAME:-compensaproject_compensa_core_uploads}
  portainer_data:
    name: ${PORTAINER_VOLUME_NAME:-compensa_portainer_data}

networks:
  compensa:
    driver: overlay
    attachable: true
